name: Upstream auto-merge

# Enable auto-merge (or squash-merge) only after Upstream sync CI completes.
# Runs in default-branch context — no action_required approval gate.
on:
  workflow_run:
    workflows: ["Upstream sync CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-when-green:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge upstream sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "${{ github.repository }}" \
            --head auto/upstream-sync --base main --state open \
            --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No open PR for auto/upstream-sync."
            exit 0
          fi

          echo "Merging PR #$pr (Upstream sync CI passed)."
          if gh pr merge "$pr" --squash; then
            echo "Squash-merged PR #$pr."
            exit 0
          fi

          echo "Direct merge failed; trying auto-merge (squash)..."
          if gh pr merge "$pr" --auto --squash; then
            echo "Auto-merge enabled for PR #$pr."
          else
            echo "::warning::Could not merge PR #$pr automatically."
            exit 1
          fi
