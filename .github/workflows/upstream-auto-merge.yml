name: Upstream auto-merge

# Manual recovery only. Normal path: upstream-pr-ci.yml merges at job end.
# workflow_run chaining is blocked when the upstream job used GITHUB_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-when-green:
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge open upstream sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "${{ github.repository }}" \
            --head auto/upstream-sync --base main --state open \
            --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No open PR for auto/upstream-sync."
            exit 0
          fi
          echo "Squash-merging PR #$pr."
          gh pr merge "$pr" --squash
