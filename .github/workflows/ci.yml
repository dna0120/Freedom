name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax check
        run: |
          shopt -s globstar nullglob
          for f in *.sh tools/*.sh; do
            [[ -f "$f" ]] || continue
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shopt -s globstar nullglob
          for f in *.sh tools/*.sh; do
            [[ -f "$f" ]] || continue
            shellcheck -x -S error "$f" || exit 1
          done

      - name: Verify SHA256 pins
        env:
          SKIP_RAW_VERIFY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash tools/verify_sha_pins.sh
