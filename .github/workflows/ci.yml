name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    # Regular CI skips auto/upstream-sync PRs (see upstream-pr-ci.yml).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'auto/upstream-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax check
        run: |
          shopt -s globstar nullglob
          for f in *.sh tools/*.sh; do
            [[ -f "$f" ]] || continue
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shopt -s globstar nullglob
          for f in *.sh tools/*.sh; do
            [[ -f "$f" ]] || continue
            shellcheck -x -S error "$f" || exit 1
          done

      - name: Verify SHA256 pins
        env:
          SKIP_RAW_VERIFY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash tools/verify_sha_pins.sh

  dispatch-upstream-pr-ci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run Upstream sync CI for open bot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" \
            --head auto/upstream-sync --base main --state open \
            --json number --jq 'length')
          if [[ "$count" -gt 0 ]]; then
            echo "Open sync PR found — dispatching Upstream sync CI."
            gh workflow run "upstream-pr-ci.yml" --repo "${{ github.repository }}"
          fi
